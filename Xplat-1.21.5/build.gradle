plugins {
	id "java"
	id "agency.highlysuspect.minivan" version "0.5"
}

ext.gimmeJava(21)

archivesBaseName = "${rootProject.name}-xplat-1.21.5"

minivan {
	version("1.21.5")
}

dependencies {
	compileOnly "org.spongepowered:mixin:0.8.5"
	implementation project(":Core")
}

tasks.withType(JavaCompile) {
	source(project(":Core").sourceSets.main.allSource)
}